<!DOCTYPE html>
<html lang="en">
<head>
 
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1"/>
<meta name="robots" content="noindex"/>
<meta name="theme-color" content="#070b1a"/>
<title>Offline — Cloud iNIT</title>
<style>
  *{box-sizing:border-box;margin:0;padding:0}
  body{font-family:'Sora',-apple-system,BlinkMacSystemFont,sans-serif;
       background:radial-gradient(900px 600px at 50% -10%,rgba(56,225,255,.16),transparent 60%),radial-gradient(700px 600px at 80% 110%,rgba(255,92,200,.12),transparent 60%),#070b1a;
       color:#f4f7ff;
       min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:32px;line-height:1.6}
  .tag{font-family:'JetBrains Mono',ui-monospace,Menlo,monospace;font-size:11px;font-weight:600;letter-spacing:.14em;text-transform:uppercase;
       color:#8b7bff;border:1px solid rgba(139,123,255,.35);background:rgba(139,123,255,.1);padding:5px 12px;border-radius:6px;margin-bottom:24px}
  h1{font-family:'Space Grotesk','Sora',sans-serif;font-size:clamp(48px,12vw,110px);line-height:.9;letter-spacing:-.04em;margin-bottom:12px}
  h1 em{font-style:normal;background:linear-gradient(120deg,#38e1ff,#8b7bff 55%,#ff5cc8);-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent;color:#38e1ff}
  h2{font-family:'Space Grotesk','Sora',sans-serif;font-size:clamp(19px,3vw,26px);font-weight:800;margin-bottom:12px}
  p{max-width:460px;color:#9aa4c8;margin-bottom:30px}
  button{font:700 14px/1 'JetBrains Mono',monospace;color:#04121a;background:linear-gradient(120deg,#38e1ff,#8b7bff 55%,#ff5cc8);border:none;padding:14px 26px;border-radius:10px;cursor:pointer;transition:.25s;box-shadow:0 10px 30px rgba(56,225,255,.3)}
  button:hover{transform:translateY(-2px);box-shadow:0 16px 40px rgba(139,123,255,.4)}
  .dot{display:inline-block;width:8px;height:8px;border-radius:50%;background:#8b7bff;margin-right:7px;box-shadow:0 0 8px #8b7bff}
</style>
</head>
<body>
  <div class="tag"><span class="dot"></span>No network · offline</div>
  <h1>0<em>ff</em>line</h1>
  <h2>The boot sequence can't reach the network</h2>
  <p>You appear to be offline. Cloud iNIT will reconnect automatically the moment your connection returns — or you can retry now.</p>
  <button onclick="location.reload()">Retry connection</button>
  <script>window.addEventListener('online', () => location.reload());</script>
</body>
</html>
